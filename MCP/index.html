var S="pf-key-"+P.salt;
function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function show(){document.getElementById("gate").classList.remove("hidden")}
function open(k){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},k,u8(P.ct)).then(function(buf){
    var html=new TextDecoder().decode(buf);
    function swap(){document.open();document.write(html);document.close();}
    if(document.readyState==="complete")swap();else window.addEventListener("load",swap);
  });
}
function derive(pw){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(b){

}
